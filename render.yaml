services:
  # FutureHub Full-Stack Production Web Service
  - type: web
    name: futurehub
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build:render
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_PATH
        sync: false
